version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    groups:
      core-python:
        patterns:
          - "*"
    commit-message:
      prefix: deps(core)

  - package-ecosystem: pip
    directory: /RealLLM
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    groups:
      real-llm-python:
        patterns:
          - "*"
    commit-message:
      prefix: deps(real-llm)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps(actions)
