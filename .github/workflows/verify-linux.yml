name: Verify Linux

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            .github/locks/pip-bootstrap.txt
            .github/locks/core-linux-py312.txt
      - name: Install hash-locked policy dependencies
        run: |
          python -m pip install --require-hashes -r .github/locks/pip-bootstrap.txt
          python -m pip install --require-hashes -r .github/locks/core-linux-py312.txt
          python -m pip check
      - name: Verify immutable beacon compatibility boundary
        run: ./corelm beacon verify-tag
      - name: Verify workflow, dependency, and secret policy
        run: python security/verify_supply_chain.py
      - name: Verify direct-dependency SBOM is current
        run: >-
          python security/generate_direct_sbom.py
          --check security/direct-dependencies.cdx.json
      - name: Audit pinned dependencies with OSV
        run: >-
          python security/osv_direct_audit.py
          .github/locks/pip-bootstrap.txt
          requirements.lock
          RealLLM/requirements.lock

  python-and-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            .github/locks/pip-bootstrap.txt
            .github/locks/core-linux-py312.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r .github/locks/pip-bootstrap.txt
          python -m pip install --require-hashes -r .github/locks/core-linux-py312.txt
          python -m pip check
      - run: PYTHON_BIN=python ./corelm verify
      - name: Verify exploratory real-Qwen pilot artifact
        run: python RealLLM/verify_real_llm_evidence.py
      - name: Verify adaptive real-Qwen development artifacts
        run: python RealLLM/verify_voidtoken_v5_development.py
      - name: Verify prospective registration and real-Qwen artifacts
        run: python RealLLM/verify_voidtoken_v5_evidence.py --require-git-provenance
      - name: Verify deterministic publication archives
        run: python publication/build_archives.py --verify-determinism
