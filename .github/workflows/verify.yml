name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install jsonschema==4.25.1
      - run: PYTHON_BIN=python ./run_tests.sh
      - name: Verify exploratory real-LLM pilot artifact
        run: python RealLLM/verify_real_llm_evidence.py
      - name: Replay and verify registered evidence
        run: python BenchmarkCore/verify_evidence.py
      - name: Verify deterministic publication archives
        run: python publication/build_archives.py --verify-determinism

  macos-app:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHON_BIN=python ./run_tests.sh
      - name: Replay and verify registered evidence on macOS
        run: python BenchmarkCore/verify_evidence.py
      - run: swift build -c release
