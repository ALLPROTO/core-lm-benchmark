name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHON_BIN=python ./run_tests.sh

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release
