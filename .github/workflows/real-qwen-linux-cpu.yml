name: Real Qwen Linux CPU Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-qwen-linux-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-qwen-linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CORELM_LINUX_PYTHON: python
    steps:
      - name: Check out the exact requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Normalize the pinned hosted Python trust boundary
        run: >-
          python -I -B security/normalize_ci_python_permissions.py
          --runner-tool-cache "$RUNNER_TOOL_CACHE"
          --python-location "$pythonLocation"
      - name: Verify the Linux host
        run: ./corelm linux doctor
      - name: Build and execute the real-Qwen regression
        env:
          CORELM_LINUX_RUNTIME: ${{ runner.temp }}/corelm-linux-runtime
          CORELM_LINUX_HF_HOME: ${{ runner.temp }}/corelm-linux-model-assets
          CORELM_RUN_DIR: ${{ runner.temp }}/corelm-linux-run
        run: ./corelm linux run
      - name: Upload the complete verified run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corelm-real-qwen-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corelm-linux-run
          if-no-files-found: error
          retention-days: 90
