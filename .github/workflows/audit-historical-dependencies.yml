name: Audit Historical Dependencies (Known Risks)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'

permissions:
  contents: read

jobs:
  historical-osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.13'
      # Read the frozen pins only. Never install or execute this vulnerable runtime.
      # A nonzero result is intentionally visible, not suppressed or allowlisted.
      - name: Audit preserved historical pins without installing them
        run: >-
          python security/osv_direct_audit.py
          .github/locks/pip-bootstrap.txt
          RealLLM/requirements.lock
